    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Color de la barra superior; cambia con los colores que elija el usuario (src/theme/apply.ts). -->
    <meta name="theme-color" content="#1d1f1c" />
    <!-- Icono en línea: cuadrado oscuro con la dona de presupuesto (usado en verde sobre pendiente). -->

      rel="icon"

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231d1f1c'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23c9d3c9' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%232f7d52' stroke-width='5' stroke-dasharray='35 53.41' transform='rotate(-90 16 16)'/%3E%3C/svg%3E"
    />

      </p>
