name = "fe-finance"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# D1: source of truth for the history.
# Created with `npx wrangler d1 create finanzas`; the database_id is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "finanzas"
database_id = "a0d77035-0673-4378-9a0e-5d488dd8480f"
migrations_dir = "migrations"

# Users of the app, each with their own separate finances: id:Name pairs separated by commas.
# To add or rename someone, it is enough to edit this line and deploy again.
# The id (before the colon) is the key of their data: do not change it once it has records.
[vars]
USERS = "frank:Frank,eda:Eda"

# These do not go here, but as project secrets (`npx wrangler pages secret put <NAME> --project-name fe-finance`):
#   API_TOKEN            Bearer for /api/ingest/* and /mcp (the one Claude uses).
#   ACCESS_TEAM_DOMAIN   "<team>.cloudflareaccess.com"     } together they turn on the validation of the Cloudflare
#   ACCESS_AUD           AUD of the Access application     } Access login on /api/*. As secrets they only exist
#                                                            in production; locally there is no Access to validate.
